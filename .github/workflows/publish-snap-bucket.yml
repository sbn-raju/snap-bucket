name: Publish snap-bucket

on:
  push:
    tags:
      - "snap-bucket-v*"

jobs:
  publish:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: snap-bucket

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Remove broken install
        run: |
          rm -rf node_modules package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN:
            ${{ secrets.NPM_TOKEN }}